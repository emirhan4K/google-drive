version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - '3000:3000'
    volumes:
      # Windows'taki kodlarını Docker içine anlık yansıtır (Hot Reload köprüsü)
      - .:/app
      - /app/node_modules
    env_file:
      # İŞTE SORDUĞUN KISIM BURASI! Windows'taki .env dosyanı alıp Docker'a aktaran komut
      - .env
    depends_on:
      - mongodb
      - redis

  mongodb:
    image: mongo:7.0
    ports:
      - '27017:27017'
    volumes:
      # Konteyner kapandığında verilerin silinmemesi için kalıcı sanal disk alanı
      - mongo-data:/data/db

  redis:
    image: redis:alpine
    ports:
      - '6380:6379'

volumes:
  mongo-data: